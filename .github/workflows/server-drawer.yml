name: Build Server Drawer

on:
  push:
    branches: [main]
    paths:
      - 'server-drawer/**'
      - '.github/workflows/server-drawer.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: server-drawer-build
  cancel-in-progress: false

jobs:
  drawer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: Valenced/valenced-community-plugins
          ref: 8942e8d3375bc508b3b949e7d55fa9835f175250
          path: upstream
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Overlay only Server Drawer
        run: |
          rm -rf upstream/plugins/server-drawer
          mkdir -p upstream/plugins/server-drawer
          cp -a fork/server-drawer/. upstream/plugins/server-drawer/
      - name: Install locked dependencies
        working-directory: upstream
        run: bun install --frozen-lockfile
      - name: Type-check drawer
        working-directory: upstream
        run: bun x tsc --noEmit -p plugins/server-drawer/tsconfig.json
      - name: Build and package drawer
        working-directory: upstream
        run: ./gradlew --no-daemon packageServerDrawer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate ZIP
        working-directory: upstream
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          manifest = json.loads(pathlib.Path('plugins/server-drawer/manifest.json').read_text())
          path = pathlib.Path('build/dist') / (manifest['id'] + '@' + manifest['version'] + '.zip')
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert 'manifest.json' in z.namelist()
              assert manifest['dist']['script'] in z.namelist()
              assert json.loads(z.read('manifest.json'))['id'] == manifest['id']
              assert z.getinfo(manifest['dist']['script']).file_size > 0
          print(path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: server-drawer
          path: upstream/build/dist/dev.vadinyt.server-drawer@*.zip
          if-no-files-found: error
      - name: Publish validated drawer to Valenced index
        if: github.ref == 'refs/heads/main'
        run: |
          cd fork
          git fetch origin main
          git rebase origin/main
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          plugin_id = 'dev.vadinyt.server-drawer'
          manifest = json.loads(pathlib.Path('server-drawer/manifest.json').read_text())
          version = manifest['version']
          name = f'{plugin_id}@{version}.zip'
          source = pathlib.Path('../upstream/build/dist') / name
          payload = source.read_bytes()
          with zipfile.ZipFile(source) as z:
              built = json.loads(z.read('manifest.json'))
              assert z.testzip() is None and built['id'] == plugin_id and built['version'] == version
              assert z.getinfo(built['dist']['script']).file_size > 0
          target = pathlib.Path('pool') / name
          assert not target.exists() or target.read_bytes() == payload, 'Refusing to overwrite version'
          index_path = pathlib.Path('index.json')
          index = json.loads(index_path.read_text())
          entry = index['plugins'][plugin_id]
          release = {'url': f'https://raw.githubusercontent.com/Vadinyt/ValencedFonts/main/pool/{name}', 'sha256': hashlib.sha256(payload).hexdigest(), 'size': len(payload), 'dependencies': built['dependencies']}
          assert version not in entry['versions'] or entry['versions'][version] == release
          entry['name'] = built['name']
          entry['description'] = built['description']
          entry['versions'][version] = release
          entry['channels']['latest'] = version
          target.write_bytes(payload)
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.json pool/dev.vadinyt.server-drawer@*.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish validated Server Drawer plugin"
          git push origin HEAD:main
